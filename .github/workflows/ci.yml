name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    name: Build and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build without OpenMP
        run: make

      - name: Run smoke test
        run: make test

      - name: Clean build artifacts
        run: make clean

      - name: Build with OpenMP
        run: make USE_OPENMP=1

      - name: Run smoke test with OpenMP build
        run: make test

  macos-openmp:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install OpenMP runtime
        run: brew install libomp

      - name: Build with Apple Clang and OpenMP
        run: make USE_OPENMP=1

      - name: Run smoke test
        run: make test
